# Netlify: baut die PWA und leitet alle Pfade auf index.html (Angular-Routing, z. B. /a/123).
[build]
  command = "npm run build"
  publish = "dist/spontis/browser"

[build.environment]
  NODE_VERSION = "24"

# Manifest mit richtigem Typ, damit Handys die App installieren können
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Diese Dateien nie zwischenspeichern, damit neue Versionen sofort ankommen
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ngsw.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
